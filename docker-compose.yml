version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - dashboard-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000/api
    restart: unless-stopped
    networks:
      - dashboard-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./database:/app/database
      - ./database/schema.sql:/app/database/schema.sql
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/database/analytics.duckdb
      - SCHEMA_PATH=/app/database/schema.sql
      - DATA_FILE=/app/data/sample_data.csv
    restart: unless-stopped
    networks:
      - dashboard-network

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_DRIVER=duckdb
    networks:
      - dashboard-network

networks:
  dashboard-network:
    driver: bridge